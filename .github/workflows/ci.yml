name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bundle the Android app
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
      - name: Bundle the web app (what Vercel deploys)
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web"

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: vocab.json is up to date with data/pdf and data/supplement
        run: |
          python scripts/build_vocab.py
          git diff --exit-code app/src/data/vocab.json
      - name: conjugation.json copies match
        run: diff data/pdf/conjugation.json app/src/data/conjugation.json
      - name: Validate vocabulary
        run: python scripts/validate_vocab.py app/src/data/vocab.json
