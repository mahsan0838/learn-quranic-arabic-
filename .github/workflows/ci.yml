name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: vocab.json is up to date with data/pdf and data/supplement
        run: |
          python scripts/build_vocab.py
          git diff --exit-code web/src/data/vocab.json
      - name: conjugation.json copies match
        run: diff data/pdf/conjugation.json web/src/data/conjugation.json
      - name: Validate vocabulary
        run: python scripts/validate_vocab.py web/src/data/vocab.json
